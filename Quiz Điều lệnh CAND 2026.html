body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

h1{font-size:1.15rem;margin:0 0 2px}.sub{color:var(--mut);font-size:.85rem;margin:0 0 12px}

<h1>Câu hỏi lý thuyết tập huấn Điều lệnh, Quân sự, Võ thuật CAND năm 2026</h1>
<p class="sub">Nội dung câu hỏi và đáp án giữ nguyên theo tài liệu gốc · <span id="tot"></span> câu</p>

<script>
var DATA=[{"n": 1, "q": "Phạm vi điều chỉnh của Điều lệnh nội vụ CAND quy định vấn đề gì?", "o": {"A": "Quy định chức trách, nhiệm vụ chung của Công an nhân dân Việt Nam, Công an nhân dân là lực lượng vũ trang trọng yếu, tin cậy của Đảng Cộng sản Việt Nam và Nhà nước Cộng hòa XHCN Việt Nam.", "B": "Quy định chức trách, nhiệm vụ và mối quan hệ công tác, chế độ làm việc, công tác, chiến đấu, hội họp, huấn luyện, học tập, bảo mật, nghỉ ngơi, quản lý tài liệu, vũ khí, công cụ hỗ trợ, vật chứng, phương tiện nghiệp vụ, tài chính, tài sản, về sử dụng trang phục, tư thế, lễ tiết, tác phong, nội vụ, vệ sinh công sở của Công an các đơn vị và cán bộ, chiến sĩ Công an nhân dân.", "C": "Quy định lực lượng Công an nhân dân khi thực hiện nhiệm vụ phải theo quy trình, quy chế, chế độ công tác, lề lối làm việc, tác phong chính quy.", "D": "Cả 3 đáp án trên đều đúng."}, "c": "B"}, {"n": 2, "q": "Kế hoạch 166/KH-CAT-PX03 ngày 30/5/2026 của Giám đốc Công an tỉnh về thực hiện Chương trình hành động số 10/CTr-BCA-X03 ngày 12/5/2026 của Bộ Công an yêu cầu tổ điều lệnh bán chuyên trách Công an các đơn vị, địa phương kiểm tra việc chấp hành điều lệnh CAND ít nhất mấy lần/ tuần", "o": {"A": "01 lần", "B": "02 lần", "C": "03 lần", "D": "04 lần"}, "c": "B"}, {"n": 3, "q": "Điều lệnh đội ngũ CAND quy định có mấy vị trí chỉ huy đội hình hàng ngang?", "o": {"A": "Có 03 vị trí", "B": "Có 04 vị trí", "C": "Có 05 vị trí", "D": "Có 06 vị trí"}, "c": "A"}, {"n": 4, "q": "Phương án nào sau đây chỉ rõ chức trách, nhiệm vụ của lãnh đạo chỉ huy công an các cấp về công tác xây dựng lực lượng CAND?", "o": {"A": "Thực hiện nguyên tắc tập trung dân chủ, tập thể lãnh đạo, cá nhân phụ trách, chế độ một người chỉ huy và quy chế hoạt động của cấp ủy đảng; duy trì thực hiện nghiêm túc chế độ làm việc của lãnh đạo, chỉ huy và đơn vị.", "B": "Thực hiện công tác giáo dục chính trị tư tưởng; xây dựng và kiện toàn tổ chức bộ máy; quy hoạch, đào tạo và bồi dưỡng cán bộ, thực hiện nghiêm túc chế độ quản lý cán bộ, chăm lo xây dựng, củng cố và tăng cường đoàn kết nội bộ, động viên, khen thưởng kịp thời và xử lý kỷ luật nghiêm theo đúng quy định của Nhà nước và của Bộ Công an", "C": "Quản lý tài chính, tài sản, vật tư, vũ khí, công cụ hỗ trợ, phương tiện, trang thiết bị kỹ thuật nghiệp vụ của đơn vị đúng quy định của pháp luật và Bộ Công an, bảo đảm yêu cầu công tác, chiến đấu.", "D": "Cả 3 đáp án trên đều đúng."}, "c": "B"}, {"n": 5, "q": "Khi cấp trên ra chỉ thị, mệnh lệnh, người nhận chỉ thị, mệnh lệnh trực tiếp của cấp trên phải thực hiện thế nào cho đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Thi hành ngay với tinh thần trách nhiệm, khẩn trương, nghiêm túc.", "B": "Báo cáo với thủ trưởng trực tiếp của mình biết nội dung công việc cấp trên giao, để xin ý kiến chỉ đạo.", "C": "Phải thi hành ngay, đồng thời phải báo cáo với thủ trưởng trực tiếp của mình biết nội dung công việc cấp trên giao (trừ trường hợp cấp trên ra chỉ thị, mệnh lệnh yêu cầu không báo cáo nội dung với thủ trưởng trực tiếp).", "D": "Không đáp án nào đúng."}, "c": "C"}, {"n": 6, "q": "Theo điều lệnh nội vụ CAND, khi cần thiết, cấp trên có được ra chỉ thị, mệnh lệnh trực tiếp không?", "o": {"A": "Không được ra chỉ thị, mệnh lệnh trực tiếp.", "B": "Được ra chỉ thị, mệnh lệnh trực tiếp không qua thủ trưởng quản lý CBCS", "C": "Thực hiện theo quy chế làm việc của đơn vị.", "D": "Thực hiện theo quy định của Đảng và quy chế làm việc của đơn vị."}, "c": "B"}, {"n": 7, "q": "Khi không cần thiết, cấp trên ra chỉ thị, mệnh lệnh như thế nào cho đúng với quy định Điều lệnh nội vụ CAND?", "o": {"A": "Tùy tình hình thực tế để ra chỉ thị, mệnh lệnh cho phù hợp.", "B": "Ra chỉ thị, mệnh lệnh trực tiếp không cần qua thủ trưởng quản lý CBCS", "C": "Cấp trên ra chỉ thị, mệnh lệnh phải qua từng cấp, từ trên xuống dưới theo hệ thống tổ chức của lực lượng CAND", "D": "Đáp án A và C đều đúng."}, "c": "C"}, {"n": 8, "q": "Khi cấp trên ra chỉ thị, mệnh lệnh, nếu thấy không phù hợp thì cấp dưới phải làm gì cho đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Không thực hiện chỉ thị, mệnh lệnh", "B": "Báo cáo lý do và không thực hiện chỉ thị, mệnh lệnh", "C": "Thực hiện ngay với tinh thần trách nhiệm, khẩn trương, chủ động, sáng tạo, sau khi xong việc sẽ dễ đạt ý kiến với người ra chỉ thị, mệnh lệnh", "D": "Đề đạt ý kiến với người ra chỉ thị, mệnh lệnh; nếu người ra chỉ thị, mệnh lệnh chưa thay đổi ý kiến, thì vẫn phải nghiêm chỉnh chấp hành."}, "c": "D"}, {"n": 9, "q": "Khi người thi hành chỉ thị, mệnh lệnh có ý kiến đề đạt, thì người ra chỉ thị, mệnh lệnh cần xử lý như thế nào cho đúng với quy định Điều lệnh nội vụ CAND?", "o": {"A": "Không chấp nhận và yêu cầu người nhận chỉ thị, mệnh lệnh phải làm ngay.", "B": "Người ra chỉ thị, mệnh lệnh phải nghiên cứu xem xét; nếu thấy chỉ thị, mệnh lệnh chưa dùng phải kịp thời điều chỉnh, bổ sung, sửa đổi.", "C": "Yêu cầu người nhận chỉ thị, mệnh lệnh phải làm ngay; ý kiến để đạt sẽ được nghiên cứu, xem xét, giải quyết sau.", "D": "Thu hồi lại chỉ thị, mệnh lệnh."}, "c": "B"}, {"n": 10, "q": "Theo điều lệnh nội vụ CAND, đơn vị và cán bộ, chiến sĩ phải xây dựng chương trình, kế hoạch công tác tuần, tháng, quý như thế nào cho đúng?", "o": {"A": "Các đơn vị, địa phương phải xây dựng chương trình, kế hoạch công tác tuần, tháng, quý, 6 tháng, 1 năm; cán bộ, chiến sĩ Công an nhân dân phải xây dựng chương trình, kế hoạch công tác tuần được thủ trưởng trực tiếp phụ trách duyệt.", "B": "Các đơn vị và cán bộ, chiến sĩ CAND phải xây dựng chương trình, kế hoạch công tác tuần, tháng, quý, 6 tháng, 1 năm.", "C": "Các đơn vị CAND phải xây dựng chương trình, kế hoạch công tác 6 tháng, 1 năm.", "D": "Các đơn vị, địa phương và cán bộ chiến sĩ phải xây dựng chương trình, kế hoạch công tác tuần, tháng, quý, 6 tháng, 1 năm và được thủ trưởng trực tiếp phụ trách duyệt."}, "c": "A"}, {"n": 11, "q": "Khi gặp tình huống khẩn cấp, đột xuất, bất ngờ nguy hại đến an ninh trật tự, CBCS phải làm gì cho đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Thông báo cho đơn vị công an gần nhất biết để giải quyết. Tham gia giải quyết và tìm mọi cách ngăn chặn hậu quả xảy ra", "B": "Tham gia giải quyết và tìm mọi cách ngăn chặn hậu quả xảy ra, đồng thời báo ngay cho đơn vị Công an hoặc chính quyền địa phương nơi gần nhất để giải quyết", "C": "Xác định không phải nhiệm vụ của mình, mình không tham gia giải quyết", "D": "Đáp án A và B đều đúng"}, "c": "B"}, {"n": 12, "q": "Cán bộ, chiến sĩ CAND tham gia huấn luyện điều lệnh, quân sự, võ thuật, thể thao phải chấp hành quy định nào cho đúng với Điều lệnh CAND?", "o": {"A": "Chấp hành nghiêm nội quy, kỷ luật nơi luyện tập, thao trường và mệnh lệnh của người chỉ huy", "B": "Giữ đúng tư thế lễ tiết tác phong, kỷ luật nơi luyện tập, thao trường và mệnh lệnh của người chỉ huy", "C": "Giữ dúng tư thế lễ tiết tác phong, chấp hành nghiêm nội quy và mệnh lệnh của người chỉ huy", "D": "Cả 3 đáp án trên đều dùng"}, "c": "A"}, {"n": 13, "q": "Điều lệnh nội vụ CAND quy định trong chiến đấu, cán bộ, chiến sĩ CAND phải thực hiện yêu cầu nào?", "o": {"A": "Phải nêu cao chủ nghĩa anh hùng cách mạng, mưu trí dũng cảm, sẵn sàng hy sinh để bảo vệ Tổ quốc, bảo vệ Đảng Nhà nước, nhân dân và chế độ xã hội chủ nghĩa. Trong bất kỳ hoàn cảnh nào cũng phải kiên quyết bảo vệ đồng dội, bảo vệ nhân dân, bảo vệ vũ khí phương tiện chiến đấu, hồ sơ, tài liệu; giữ vững khí tiết của người Công an cách mạng.", "B": "Phải nêu cao chủ nghĩa anh hùng cách mạng, mưu trí dũng cảm, sẵn sàng bảo vệ Tổ quốc, bảo vệ Đảng Nhà nước, nhân dân và chế độ xã hội chủ nghĩa. Trong bất kỳ hoàn cảnh nào cũng phải chấp hành nghiêm kỷ luật, mệnh lệnh, sẵn sàng hoàn thành nhiệm vụ được giao.", "C": "Phải nêu cao chủ nghĩa anh hùng cách mạng, mưu trí dũng cảm, sẵn sàng hy sinh để bảo vệ Tổ quốc, bảo vệ Dàng Nhà nước, nhân dân và chế độ xã hội chủ nghĩa. Thực hiện nghiêm các quy định về phương án chiến đấu, tuyệt đối bảo vệ bí mật.", "D": "Cả 3 đáp án trên đều đúng."}, "c": "A"}, {"n": 14, "q": "Điều lệnh nội vụ CAND quy định CBCS phải chấp hành kỷ luật công tác khi biệt phái, xã hội hóa như thế nào?", "o": {"A": "Chấp hành nghiêm túc nội quy của đơn vị, không gây ảnh hưởng đến người khác và của đơn vị, luôn giữ gìn phẩm chất, tư cách người công an cách mạng.", "B": "Nêu cao tinh thần trách nhiệm, tư thế, lễ tiết tác phong nghiêm túc, luôn giữ gìn phẩm chất, tư cách người công an cách mạng.", "C": "Chấp hành nghiêm các nguyên tắc, chế độ công tác do Bộ trưởng Bộ Công an quy định, luôn giữ gìn phẩm chất, tư cách người công an cách mạng.", "D": "Nêu cao tinh thần trách nhiệm, tư thế, lễ tiết tác phong nghiêm túc. Chấp hành nghiêm các nguyên tắc, chế độ công tác của Bộ Công an quy định, luôn giữ gìn phẩm chất, tư cách người công an cách mạng."}, "c": "C"}, {"n": 15, "q": "Điều lệnh nội vụ CAND quy định CBCS phải chấp hành kỷ luật lao động như thế nào cho đúng?", "o": {"A": "Có mặt tại nơi làm việc trước 5 phút và nghỉ đúng giờ quy định.", "B": "Có mặt tại nơi làm việc trước 10 phút và nghỉ đúng giờ quy định.", "C": "Có mặt tại nơi làm việc trước 15 phút và nghỉ đúng giờ quy định.", "D": "Có mặt đúng giờ tại nơi làm việc, hội họp, học tập và nghỉ đúng giờ quy định"}, "c": "A"}, {"n": 16, "q": "Theo Điều lệnh nội vụ CAND quan hệ giữa thủ trưởng và các phó thủ trưởng như thế nào là đúng?", "o": {"A": "Quan hệ giữa thủ trưởng với các phó thủ trưởng là quan hệ giữa người chỉ huy cao nhất của đơn vị với cấp phó giúp việc. Khi thủ trưởng đi vắng thì đồng chí phó thủ trưởng là phó bí thư (hoặc phó Tham mưu) thay thủ trưởng phụ trách đơn vị.", "B": "Quan hệ giữa thủ trưởng với các phó thủ trưởng là quan hệ giữa người chỉ huy cao nhất của đơn vị với cấp phó cùng cấp. Khi thủ trưởng đi vắng thì chỉ định phó thủ trưởng là phó bí thư (hoặc phó Tham mưu) thay mình phụ trách đơn vị.", "C": "Quan hệ giữa thủ trưởng với các phó thủ trưởng là quan hệ giữa người chỉ huy cao nhất của đơn vị với cấp phó cùng cấp. Khi thủ trưởng đi vắng thì chỉ định một phó thủ trưởng thay mình phụ trách đơn vị.", "D": "Cả 3 đáp án trên đều dùng"}, "c": "C"}, {"n": 17, "q": "Điều lệnh nội vụ CAND quy định, khi cấp trên tổ chức hội nghị, cuộc họp, buổi lễ, học tập, CBCS dự có được rời khỏi nơi hội nghị, buổi lễ ngay sau khi người chủ trì tuyên bố kết thúc?", "o": {"A": "Được rời khỏi nơi hội nghị ngay sau khi người chủ trì tuyên bố kết thúc.", "B": "Được rời khỏi nơi hội nghị, hội họp và chờ ra về cùng với lãnh đạo cấp trên", "C": "Rời khỏi nơi hội nghị, hội họp sau khi lãnh đạo cấp trên ra về", "D": "Rời khỏi nơi tổ chức hội nghị, cuộc họp, buổi lễ, học tập sau khi người chủ trì tuyên bố kết thúc, lãnh đạo cấp trên ra về."}, "c": "D"}, {"n": 18, "q": "Điều lệnh nội vụ CAND quy định các Tổ nghiệp vụ của Công an xã, phường và cấp đội thuộc Phòng nghiệp vụ tổ chức giao ban định kỳ như thế nào?", "o": {"A": "Tổ chức giao ban hằng ngày.", "B": "Tổ chức giao ban hằng tuần.", "C": "Tổ chức giao ban hằng tháng.", "D": "Tổ chức giao ban 2 lần/tuần."}, "c": "A"}, {"n": 19, "q": "Điều lệnh nội vụ CAND quy định Công an Cấp phòng, xã, phường tổ chức giao ban định kỳ như thế nào?", "o": {"A": "Tổ chức giao ban hằng ngày.", "B": "Tổ chức giao ban hằng tuần.", "C": "Tổ chức giao ban hằng tháng.", "D": "Tổ chức giao ban hằng quý."}, "c": "B"}, {"n": 20, "q": "Điều lệnh nội vụ CAND quy định Công an tỉnh, thành phố trực thuộc Trung ương, các đơn vị trực thuộc Bộ Công an và đơn vị tương đương phải tổ chức giao ban định kỳ như thế nào cho đúng?", "o": {"A": "Giao ban theo hằng tuần.", "B": "Giao ban theo hằng tháng.", "C": "Giao ban theo hằng quý", "D": "Giao ban 2 lần/tháng."}, "c": "B"}, {"n": 21, "q": "Điều lệnh nội vụ Công an nhân dân quy định nhiệm vụ của cán bộ trực chỉ huy là gì?", "o": {"A": "Phải nắm vững tình hình mọi mặt của đơn vị để xử lý và giải quyết các công việc theo đúng chức trách, nhiệm vụ, quyền hạn được giao.", "B": "Nắm vững quân số đơn vị, tình hình về công tác xây dựng lực lượng để xử lý và giải quyết công việc.", "C": "Nắm vững quân số đơn vị, xử lý và giải quyết các yêu cầu công tác khác được giao.", "D": "Nắm vững quân số đơn vị, tình hình đơn vị, thường xuyên kiểm tra đôn đốc quân số trực của đơn vị."}, "c": "A"}, {"n": 22, "q": "Đồng chí cho biết những nhiệm vụ nào sau đây của cán bộ trực ban đơn vị đúng theo quy định của Điều lệnh nội vụ CAND?", "o": {"A": "Giúp thủ trưởng nắm vững quân số, vũ khí, trang bị phương tiện. Đề xuất xử lý và giải quyết các yêu cầu công tác, chiến đấu, xây dựng lực lượng, hậu cần kỹ thuật. Đeo băng trực ban, có sổ ghi chép và phương tiện cần thiết phục vụ công tác", "B": "Giúp thủ trưởng nắm vững quân số, vũ khí, trang bị phương tiện. Đề xuất xử lý và giải quyết các yêu cầu công tác, chiến đấu, xây dựng lực lượng, hậu cần kỹ thuật Đeo băng trực ban, có sổ ghi chép và phương tiện cần thiết phục vụ công tác. Nắm tình hình của đơn vị về công tác chính trị tư tưởng", "C": "Giúp thủ trưởng nắm vững quân số, vũ khí, trang bị phương tiện. Đề xuất xử lý và giải quyết các yêu cầu công tác, chiến đấu, xây dựng lực lượng, hậu cần kỹ thuật đeo băng trực ban, có sổ ghi chép và phương tiện cần thiết phục vụ công tác. Đôn đốc, báo động, kiểm tra quân số CBCS trực trong ngày.", "D": "Cả 3 đáp án trên đều đúng"}, "c": "A"}, {"n": 23, "q": "Nội dung khẩu hiệu Chương trình hành động số 10/CTr-BCA-X03 ngày 12/5/2026 của Bộ Công an?", "o": {"A": "Tăng cường kỷ luật, siết chặt kỷ cương, nâng cao ý thức chấp hành điều lệnh Công an nhân dân", "B": "Siết chặt kỷ cương, tăng cường kỷ luật, , nâng cao ý thức chấp hành điều lệnh Công an nhân dân", "C": "Nâng cao ý thức chấp hành điều lệnh, tăng cường kỷ luật, siết chặt kỷ cương trong CAND.", "D": "Tăng cường kỷ luật, kỷ cương, nâng cao ý thức chấp hành điều lệnh Công an nhân dân."}, "c": "A"}, {"n": 24, "q": "Điều lệnh nội vụ CAND quy định CBCS phải chấp hành nghiêm các quy định về bảo vệ bí mật như thế nào?", "o": {"A": "Phải chấp hành nghiêm các quy định về bảo vệ bí mật của Đảng, Nhà nước và của Bộ Công an", "B": "Phải chấp hành nghiêm các quy định về bảo vệ bí mật của Đảng, Nhà nước, của Bộ Công an và các quy định về bảo vệ bí mật của cơ quan, đơn vị", "C": "Phải chấp hành nghiêm các quy định về bảo vệ bí mật của Đảng, Nhà nước và của Bộ Công an; các quy định về quy chế, chế độ công tác bảo mật.", "D": "Phải chấp hành các quy định của Đảng, pháp luật của nhà nước, các quy định của Bộ Công an và địa phương nơi cư trú."}, "c": "A"}, {"n": 25, "q": "Khi phát hiện có dấu hiệu lộ, lọt bí mật của Đảng, Nhà nước hoặc của ngành, CBCS phải làm gì cho đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Kịp thời nhắc nhở người để lộ, lọt bí mật và yêu cầu người đó phải rút kinh nghiệm để sửa chữa và báo cáo ngay cấp có thẩm quyền xem xét, giải quyết xử lý.", "B": "Kịp thời có biện pháp ngăn chặn và báo cáo ngay cấp có thẩm quyền xem xét, xử lý.", "C": "Kịp thời nhắc nhở người để lộ, lọt bí mật và đề xuất lãnh đạo cấp trên có hình thức kỷ luật người để lộ, lọt bí mật.", "D": "Để mặc, vì đó không phải nhiệm vụ của mình."}, "c": "B"}, {"n": 26, "q": "Theo điều lệnh nội vụ CAND quy định: Thủ trưởng đơn vị quyết định tổ chức giao ban đột xuất, rút ngắn hoặc kéo dài định kỳ các buổi giao ban phải căn cứ vào đâu?", "o": {"A": "Căn cứ theo chương trình, kế hoạch công tác năm và đảm bảo phù hợp thực tế của đơn vị", "B": "Căn cứ theo ý kiến đề xuất của lãnh đạo và đảm bảo phù hợp thực tế của đơn vị", "C": "Căn cứ tình hình và tính chất công tác, đảm bảo phù hợp với tình hình thực tế của đơn vị", "D": "Căn cứ vào nghị quyết của các cấp ủy đảng và quy chế làm việc của đơn vị"}, "c": "C"}, {"n": 27, "q": "Theo Điều lệnh nội vụ CAND: Trong trường hợp do yêu cầu công tác, chiến đấu phải cùng nhau thực hiện một nhiệm vụ, lãnh đạo cấp trên chưa chỉ định người chỉ huy thì phải căn cứ vào đâu để chọn ra người chỉ huy?", "o": {"A": "Căn cứ vào cấp bậc hàm, chức vụ, thâm niên công tác, tuổi đời", "B": "Căn cứ vào chức vụ, cấp bậc hàm, tuổi đời, thâm niên công tác", "C": "Căn cứ vào chức vụ, cấp bậc hàm, thâm niên công tác, tuổi đời", "D": "Căn cứ vào tuổi đời, chức vụ, cấp bậc hàm, thâm niên công tác."}, "c": "C"}, {"n": 28, "q": "Nội vụ vệ sinh nơi ăn, ngủ, nghỉ của CBCS sắp xếp như thế nào cho đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Nhà ăn nhà bếp phải có biển hiệu, nội quy và thực hiện công khai tài chính", "B": "CBCS trong các doanh trại tập trung, học sinh, sinh viên các trường CAND phải ăn nghỉ sinh hoạt tại nhà tập thể của đơn vị", "C": "Nơi ngủ nghỉ của CBCS phải sắp xếp gọn gàng, ngăn nắp, vệ sinh sạch sẽ.", "D": "Cả 3 đáp án trên đều đúng"}, "c": "D"}, {"n": 29, "q": "Điều lệnh nội vụ CAND quy định khi thi hành nhiệm vụ, cấp dưới phải tuân thủ điều gì?", "o": {"A": "Phải tuyệt đối chấp hành mệnh lệnh cấp trên trong khi thi hành nhiệm vụ", "B": "Phải tuyệt đối chấp hành mệnh lệnh, tôn trọng, lắng nghe ý kiến của cấp trên khi thi hành nhiệm vụ.", "C": "Phải lắng nghe ý kiến của cấp trên, nghiêm chỉnh chấp hành nhiệm vụ được giao", "D": "Cả 3 đáp án trên đều đúng"}, "c": "A"}, {"n": 30, "q": "Theo Điều lệnh nội vụ CAND quan hệ giữa cán bộ, chiến sĩ Công an nhân dân là mối quan hệ như thế nào?", "o": {"A": "Là quan hệ đồng chí, đồng đội, bình đẳng, tôn trọng lẫn nhau, cùng thực hiện nhiệm vụ được cấp trên giao.", "B": "Là quan hệ đồng đội, bình đẳng trong tập thể đơn vị, giúp đỡ nhau thực hiện và hoàn thành nhiệm vụ được giao", "C": "Là quan hệ đồng chí, đồng đội, đồng nghiệp, tôn trọng, đoàn kết, thương yêu, giúp đỡ nhau hoàn thành nhiệm vụ.", "D": "Là quan hệ đồng chí, đồng đội, tôn trọng đoàn kết cùng thực hiện nhiệm vụ"}, "c": "C"}, {"n": 31, "q": "Điều lệnh nội vụ CAND quy định, khi làm nhiệm vụ, quan hệ tiếp xúc với tổ chức, cá nhân nước ngoài, cán bộ, chiến sĩ CAND phải chấp hành những quy định nào?", "o": {"A": "Phải chấp hành nghiêm chỉnh pháp luật của Nhà nước, các quy định của Bộ Công an và quy chế ngoại giao, phải tôn trọng pháp luật, phong tục tập quán của nước sở tại, không làm điều gì tổn hại đến danh dự của Tổ quốc, của Đảng và lực lượng CAND Việt Nam.", "B": "Phải chấp hành nghiêm chỉnh pháp luật của Nhà nước, các quy định của Bộ Công an và quy chế ngoại giao, phải có thái độ đúng mực tôn trọng mọi người, không làm điều gì tổn hại đến danh dự của Tổ quốc, của Đảng và lực lượng CAND Việt Nam.", "C": "Phải chấp hành nghiêm chỉnh pháp luật của Nhà nước, các quy định của Bộ Công an và quy chế ngoại giao, phải thẳng thắn trao đổi công việc với tổ chức, cá nhân nước ngoài khi họ có ý kiến đề xuất, kiến nghị.", "D": "Phải chấp hành nghiêm quy định của Đảng, pháp luật của Nhà nước, các quy định của Bộ Công an, không làm điều gì tổn hại đến danh dự của Tổ quốc, của Đảng và nhà nước Việt Nam."}, "c": "A"}, {"n": 32, "q": "Trong trường hợp phạm nhân, trại viên chào cán bộ, chiến sĩ làm nhiệm vụ ở các trại giam, trại tạm giam thì đồng chí thực hiện như thế nào cho đúng với quy định của điều lệnh CAND?", "o": {"A": "Chào lại bằng động tác và bằng lời", "B": "Chào lại bằng lời", "C": "Chào lại bằng động tác", "D": "Không chào vì họ đang là phạm nhân."}, "c": "B"}, {"n": 33, "q": "Trong các học viện, trường CAND, ngoài việc xung hô với nhau bằng “đồng chí” và “tôi”, giáo viên, học sinh, sinh viên có thể xung hộ bằng \"thầy, cô\" và \"em\". Trường hợp học sinh, sinh viên nhiều tuổi hơn thầy giáo, cô giáo, ngoài cách xưng hô trên thì xưng hô như thế nào cho đúng theo quy định của điều lệnh?", "o": {"A": "Xưng hô bằng \"Thầy, cô giáo\" và \"Em”", "B": "Xưng hô bằng \"Thầy”, “Cô” và xưng \"Tôi\"", "C": "Xưng hô bằng \"Anh, chị\" và \"Tôi\"", "D": "Tùy theo chức vụ, cấp bậc, tuổi đời xưng hô cho phù hợp."}, "c": "B"}, {"n": 34, "q": "Đồng chí cho biết trang phục CAND gồm các loại nào sau đây đúng với quy định của Điều lệnh nội vụ CAND?", "o": {"A": "Trang phục thường dùng xuân hè, trang phục thường dùng thu đông, áo mưa, áo bạt cấp theo niên hạn.", "B": "Trang phục thường dùng.", "C": "Trang phục thường dùng xuân hè, trang phục thường dùng thu đông; lễ phục xuân hè, lễ phục đông; áo sơ mi trắng, áo mưa, áo bạt, áo bông.", "D": "Trang phục thường dùng xuân hè, trang phục thường dùng thu đông, trang phục giao mùa; lễ phục xuân hè, lễ phục đông; trang phục chuyên dùng."}, "c": "B"}, {"n": 35, "q": "Theo đồng chí mặc trang phục như thế nào đúng với quy định của điều lệnh nội vụ CAND?", "o": {"A": "Phải đồng bộ, thống nhất, gọn gàng, sạch sẽ, là phẳng, cài đủ khóa, cúc (áo thường dùng xuân hè nam không cài cúc cổ); đeo cấp hiệu, phù hiệu, số hiệu, ký hiệu, dây lưng; mặc áo sơ mi màu trắng, thắt caravat (đối với trang phục thu đông), cành tùng đơn (đối với lễ phục) đi giày, tất do Bộ Công an cấp.", "B": "Phải đồng bộ, thống nhất, gọn gàng, sạch sẽ, là phẳng, cài dù khóa, cúc; deo cấp hiệu, phù hiệu, số hiệu, ký hiệu, dây lưng, cành tùng đơn (đối với lễ phục) đi giày, tất đầy đủ.", "C": "Phải đồng bộ, thống nhất, gọn gàng, sạch sẽ, là phẳng, cài đủ khóa, cúc (áo thường dùng xuân hè nam không cải cúc cổ); đeo cấp hiệu, phù hiệu, số hiệu, ký hiệu, dây lưng; mặc áo sơ mi màu trắng, thắt caravat (đối với trang phục thu đông), cảnh tùng đơn (đối với lễ phục) đi giày, giữ đúng tư thế lễ tiết, tác phong", "D": "Cả 3 phương án trên đều đúng"}, "c": "A"}, {"n": 36, "q": "Điều lệnh nội vụ CAND quy định cán bộ, chiến sĩ khi mặc lễ phục CAND có phải đeo số hiệu không?", "o": {"A": "Không phải deo", "B": "Có phải đeo", "C": "Phải đeo khi không đeo các phần thưởng,", "D": "Không đeo khi đã đeo các phần thưởng"}, "c": "B"}, {"n": 37, "q": "Đồng chí cho biết việc đeo huân chương, huy chương, kỷ niệm chương, danh hiệu vinh dự Nhà nước ở vị trí nào trên ngực áo cho đúng với quy định của Điều lệnh CAND?", "o": {"A": "Đeo ở ngực áo bên phải", "B": "Đeo ở ngực áo bên trái", "C": "Đeo ở hai bên ngực áo", "D": "Tùy tình huống đeo cho phù hợp"}, "c": "B"}, {"n": 38, "q": "Điều lệnh nội vụ CAND quy định CBCS Công an từ tỉnh Thừa Thiên - Huế trở ra mặc trang phục xuân hè từ ngày nào đến ngày nào?", "o": {"A": "Từ ngày 1/4 đến hết ngày 31/10 hằng năm", "B": "Từ ngày 1/3 đến hết ngày 31/10 hằng năm", "C": "Từ ngày 15/3 đến hết ngày 15/11 hằng năm", "D": "Từ ngày 15/4 đến hết ngày 15/11 hằng năm"}, "c": "A"}, {"n": 39, "q": "Điều lệnh nội vụ CAND quy định CBCS Công an từ tỉnh Thừa Thiên - Huế trở ra mặc trang phục thu đông từ ngày nào đến ngày nào?", "o": {"A": "Từ ngày 1/11 năm năm trước đến hết ngày 31/3 năm sau", "B": "Từ ngày 1/11 năm trước đến hết ngày 31/4 năm sau", "C": "Từ ngày 1/10 năm trước đến hết ngày 31/3 năm sau", "D": "Từ ngày 1/10 trước đến hết ngày 31/4 năm sau"}, "c": "A"}, {"n": 40, "q": "Điều lệnh nội vụ CAND quy định mặc trang phục đeo dây chéo trong các trường hợp nào?", "o": {"A": "Trực tiếp làm nhiệm vụ bảo đảm trật tự an toàn giao thông, trật tự công cộng, tuần tra, kiểm soát, canh gác, bảo vệ mục tiêu, dẫn giải phạm nhân, trại viên, bị can, bị cáo, mặc trang phục chuyên dùng khi làm nhiệm vụ trong đội danh dự, nhạc lễ, tiêu binh, hộ tống danh dự và trong các trường hợp khác theo quy định của Bộ Công an.", "B": "Dự lễ kỷ niệm khi tham gia mít tinh, dẫn giải phạm nhân, trại viên, bị can, bị cáo, mặc trang phục chuyên dùng khi làm nhiệm vụ trong đội danh dự, nhạc lễ, tiêu binh, hộ tống danh dự và trong các trường hợp khác theo quy định của Bộ Công an", "C": "Trực tiếp làm nhiệm vụ giữ gìn trật tự an toàn giao thông, trật tự công cộng, tuần tra, kiểm soát, canh gác, bảo vệ mục tiêu, dẫn giải phạm nhân, trại viên, bị can, bị cáo, mặc trang phục chuyên dùng khi làm nhiệm vụ trong đội danh dự, nhạc lễ, tiêu binh, hộ tống danh dự, trong đội hình huấn luyện, tham gia thi điều lệnh và trong các trường hợp khác theo quy định của Bộ Công an", "D": "Thực hiện tuần tra kiểm soát giao thông, dự lễ kỷ niệm khi tham gia mít tinh, dẫn giải phạm nhân, trại viên, bị can, bị cáo, kiểm tra dân cư, tham gia hội thi, hội thao về điều lệnh CAND."}, "c": "A"}, {"n": 41, "q": "Điều lệnh nội vụ CAND quy định dây chéo được đeo như thế nào?", "o": {"A": "Từ sườn sau bên trái vòng qua vai phải sang sườn bên trái", "B": "Từ sườn sau bên phải vòng qua vai phải sang sườn bên trái", "C": "Từ sườn sau bên trái vòng qua vai trái sang sườn bên phải", "D": "Từ sườn sau bên phải vòng qua vai trái sang sườn bên phải"}, "c": "B"}, {"n": 42, "q": "Theo quy định của điều lệnh nội vụ CAND: Quan hệ giữa cấp ủy Đảng và Thủ trưởng Công an cung cấp là mối quan hệ như thế nào?", "o": {"A": "Quan hệ lãnh đạo và chấp hành", "B": "Quan hệ đồng cấp và phục tùng.", "C": "Quan hệ cấp trên, cấp dưới và phục tùng", "D": "Quan hệ ngang cấp bình đẳng phối hợp thực hiện nhiệm vụ"}, "c": "A"}, {"n": 43, "q": "Những trường hợp do yêu cầu công tác hoặc xã hội hóa cần mặc thường phục phải được thủ trưởng cấp nào quyết định?", "o": {"A": "Cấp cục, đơn vị trực thuộc Bộ, Giám đốc Công an tỉnh, thành phố trực thuộc trung ương", "B": "Cấp cục, đơn vị trực thuộc Bộ, Trưởng phòng và tương đương", "C": "Cấp Trưởng phòng và tương đương", "D": "Cả 3 đáp án trên đều đúng"}, "c": "A"}, {"n": 44, "q": "Theo điều lệnh nội vụ CAND cán bộ, chiến sĩ CAND đội mũ kê pi khi mặc trang phục trong các trường hợp nào là đúng nhất?", "o": {"A": "Làm việc, học tập, huấn luyện hoặc dự lễ ở ngoài trời. Dự lễ mít tinh trong nhà. Trực ban hội nghị, hội thi, hội thao, buổi lễ, dự lễ tang.", "B": "Làm việc, học tập, huấn luyện hoặc dự lễ ở ngoài trời, trao và nhận huân chương, huy chương, danh hiệu vinh dự Nhà nước và các hình thức khen thưởng khác. Trực ban hội nghị, hội thi, hội thao, buổi lễ, dự lễ tang.", "C": "Làm việc, học tập, huấn luyện hoặc dự lễ ở ngoài trời, trao và nhận huân chương, huy chương, danh hiệu vinh dự Nhà nước và các hình thức khen thưởng khác. Dự lễ mít tinh kỷ niệm trong nhà; Trực ban hội nghị, hội thi, hội thao, buổi lễ.", "D": "Làm việc, học tập, huấn luyện hoặc dự lễ ở ngoài trời. Dự lễ mít tinh trong nhà. Trực ban, dẫn chương trình hội nghị, hội thi, hội thao, buổi lễ, dự lễ tang,"}, "c": "B"}, {"n": 45, "q": "Ứng xử khi tiếp xúc giải quyết công việc với nhân dân được quy định như thế nào trong Điều lệnh nội vụ CAND?", "o": {"A": "Ứng xử có văn hóa, tôn trọng, khiêm tốn, bình tĩnh, tận tình, chu đáo. Thực hiện đúng quy trình công tác, nêu cao tinh thần trách nhiệm, không gây khó khăn, phiền hà với nhân dân.", "B": "Nêu cao tinh thần trách nhiệm, chức trách nhiệm vụ được giao. Thực hiện theo đúng quy định của Nhà nước, của Ngành. Không gây khó khăn, phiền hà, sách nhiễu với nhân dân.", "C": "Ứng xử có văn hóa, tôn trọng, khiêm tốn, bình tĩnh, tận tình, chu đáo. Thực hiện theo đúng quy định của Pháp luật và của Bộ Công an. Nêu cao tinh thần trách nhiệm, không sách nhiễu, gây phiền hà với nhân dân.", "D": "Nêu cao tinh thần trách nhiệm, chức trách nhiệm vụ được giao. Thực hiện ứng xử có văn hóa theo đúng quy định của Đảng, Nhà nước, của Ngành. Không gây khó khăn, phiền hà, sách nhiễu với nhân dân."}, "c": "C"}, {"n": 46, "q": "Điều lệnh nội vụ của CAND quy định khi làm nhiệm vụ phải ăn ở, sinh hoạt tại nhà dân, cán bộ, chiến sĩ cần thực hiện như thế nào?", "o": {"A": "Ứng xử có văn hóa, tôn trọng, khiêm tốn, bình tĩnh, tận tình, chu đáo. Thực hiện theo đúng quy định của Pháp luật và của Bộ Công an; tích cực tham gia lao động sản xuất, giúp dân phát triển kinh tế, xóa đói giảm nghèo.", "B": "Phải gương mẫu chấp hành chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước, quy định của địa phương; đoàn kết với nhân dân. Phải tích cực tuyên truyền, vận động xóa bỏ việc trồng cây thuốc phiện.", "C": "Phải giữ đúng từ thế, lễ tiết, tác phong; tôn trọng nếp sống của gia đình, phong tục, tập quán của địa phương và làm tốt công tác dân vận", "D": "Phải gương mẫu chấp hành chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước, quy định của địa phương; đoàn kết với nhân dân nơi cư trú; bình đẳng, hòa thuận, thực hiện nếp sống văn minh. Phải tích cực tuyên truyền nhân dân đấu tranh phòng, chống tội phạm, đảm bảo an ninh trật tự."}, "c": "C"}, {"n": 47, "q": "Điều lệnh nội vụ quy định cán bộ, chiến sĩ CAND khi sinh hoạt ở gia đình, nơi cư trú và những nơi khác phải thực hiện những yêu cầu gì?", "o": {"A": "Phải giữ đúng tư thế, lễ tết, tác phong; tôn trọng nếp sống của gia đình, phong tục, tập quán của địa phương và làm tốt công tác dân vận. Phải tích cực lao động sản xuất, phát triển kinh tế gia đình vững mạnh.", "B": "Phải gương mẫu chấp hành chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước, quy định của địa phương; đoàn kết với nhân dân nơi cư trú; trong quan hệ gia đình phải hiểu thảo, binh đẳng, hòa thuận, giúp đỡ nhau cùng tiến bộ, thực hiện nếp sống văn minh, gia đình văn hóa.", "C": "Phải gương mẫu chấp hành chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước, quy định của địa phương; đoàn kết với nhân dân nơi cư trú; trong quan hệ gia đình phải hiểu thảo, bình đẳng, hòa thuận, giúp đỡ nhau cùng tiến bộ, thực hiện nếp sống văn minh, gia đình văn hóa. Phải tích cực trong đấu tranh phòng, chống tội phạm, đảm bảo an ninh trật tự.", "D": "Phải gương mẫu chấp hành chủ trương, đường lối, chính sách của Đảng, pháp luật của Nhà nước, quy định của địa phương; đoàn kết với nhân dân nơi cư trú, bình đẳng, hòa thuận, giúp đỡ nhau cùng tiến bộ, thực hiện nếp sống văn minh, gia đình văn hóa. Phải tích cực trong đấu tranh phòng, chống tội phạm, đảm bảo an ninh trật tự nơi cư trú."}, "c": "B"}, {"n": 48, "q": "Khi tiếp xúc với các đối tượng vi phạm pháp luật, cán bộ, chiến sĩ ứng xử như thế nào cho đúng với Điều lệnh CAND?", "o": {"A": "Phải giữ đúng tư thế, lễ tiết, tác phong, có thái độ ứng xử đúng mực, không có lời nói, cử chỉ, hành vi xúc phạm, phân biệt đối xử.", "B": "Có thái độ kiên quyết, nêu cao tinh thần trách nhiệm, chức trách nhiệm vụ được giao. Thực hiện theo đúng quy định của Nhà nước, của Ngành Công an. Nêu cao tinh thần trách nhiệm, không gây khó khăn, phiền hà, phân biệt đối xử với người vi phạm.", "C": "Có thái độ kiên quyết, nêu cao tinh thần trách nhiệm, chức trách nhiệm vụ được giao, thái độ ứng xử đúng mực. Nêu cao tinh thần trách nhiệm, không gây khó khăn, phiền hà, phân biệt đối xử với người vi phạm.", "D": "Có thái độ kiên quyết, nêu cao tinh thần trách nhiệm, chức trách nhiệm vụ được giao. Thực hiện theo đúng quy định của Nhà nước, của Ngành Công an, không gây khó khăn, phiền hà, phân biệt đối xử với người vi phạm."}, "c": "A"}, {"n": 49, "q": "Đồng chí cho biết cách nhận bằng huân chương, huy chương, bằng khen, giấy khen có khung, cách nào đúng quy định của Nghi lễ CAND?", "o": {"A": "Hai cánh tay trên khép sát sườn, hai cánh tay dưới hơi co lên tạo với cánh tay trên một góc 180° (độ), hai bàn tay ngửa nắm cạnh dưới khung, 4 ngón con khép lại bên ngoài, ngón cái ôm choàng cạnh bên của khung, mặt trước hướng về phía đơn vị.", "B": "Hai cánh tay trên khép sát sườn, hai cánh tay dưới hơi co lên tạo với cánh tay trên một góc 120° (độ), hai bàn tay ngửa nắm cạnh dưới khung, 4 ngón con khép lại bên ngoài, ngón cái ôm choàng cạnh bên của khung, mặt trước hưởng về phía đơn vị.", "C": "Hai cánh tay trên khép sát sườn, hai cánh tay dưới hơi co lên tạo với cánh tay trên một góc 150° (độ), hai bàn tay ngửa năm cạnh dưới khung, 4 ngón con khép lại bên ngoài, ngón cái ôm choàng cạnh bên của khung, mặt trước hưởng về phía đơn vị.", "D": "Hai cánh tay trên khép sát sườn, hai cánh tay dưới hơi co lên tạo với cánh tay trên một góc 135° (độ), hai bàn tay ngửa năm cạnh dưới khung, 4 ngón con khép lại bến ngoài, ngón cái ôm choàng cạnh bên của khung, mặt trước hướng về phía đơn vị."}, "c": "C"}, {"n": 50, "q": "Đồng chí cho biết gián cách giữa hai cán bộ, chiến sĩ đứng cạnh nhau trên 1 hàng ngang là bao nhiêu?", "o": {"A": "70 cen-ti-mét (cm)", "B": "75 cen-ti-mét (cm)", "C": "100 cen-ti-mét (cm)", "D": "90 cen-ti-mét (cm)"}, "c": "A"}, {"n": 51, "q": "Đồng chí cho biết cự ly giữa hai cán bộ, chiến sĩ đứng liền trước sau nhau là bao nhiêu?", "o": {"A": "75 cen-ti-mét (cm)", "B": "85 cen-ti-mét (cm)", "C": "100 cen-ti-mét (cm)", "D": "90 cen-ti-mét (cm)"}, "c": "C"}, {"n": 52, "q": "Đồng chí cho biết Điều lệnh đội ngũ CAND quy định độ dài bước tiến, bước lui là bao nhiêu?", "o": {"A": "70 cen-ti-mét (cm)", "B": "75 cen-ti-mét (cm)", "C": "85 cen-ti-mét (cm)", "D": "90 cen-ti-mét (cm)"}, "c": "B"}, {"n": 53, "q": "Đồng chí cho biết Điều lệnh đội ngũ CAND quy định độ dài bước đi đều, đi nghiêm là bao nhiêu?", "o": {"A": "70 cen-ti-mét (cm)", "B": "75 cen-ti-mét (cm)", "C": "85 cen-ti-mét (cm)", "D": "90 cen-ti-mét (cm)"}, "c": "B"}, {"n": 54, "q": "Đồng chí cho biết Điều lệnh đội ngũ CAND quy định độ dài bước chạy là bao nhiêu?", "o": {"A": "75 cen-ti-mét (cm)", "B": "80 cen-ti-mét (cm)", "C": "85 cen-ti-mét (cm)", "D": "90 cen-ti-mét (cm)"}, "c": "C"}, {"n": 55, "q": "Đồng chí cho biết Điều lệnh cho đội ngũ CAND quy định độ dài bước qua phải, qua trái là bao nhiêu?", "o": {"A": "70 cen-ti-mét (cm)", "B": "Rộng bằng vai", "C": "35 cen-ti-mét (cm)", "D": "50 cen-ti-mét (cm)"}, "c": "C"}, {"n": 56, "q": "Đồng chí cho biết tốc độ đi đều, đi nghiêm là bao nhiêu?", "o": {"A": "100 bước/1 phút", "B": "106 bước/1 phút", "C": "110 bước/1 phút", "D": "60 bước/1 phút"}, "c": "B"}, {"n": 57, "q": "Lãnh đạo, chỉ huy Công an từ cấp đội, cấp xã, cấp đại đội trực thuộc trung đoàn trở lên bỏ vị trí công tác, bỏ trực không lý do; trong giờ làm việc, giờ trực, giờ nghỉ trưa của ngày làm việc, ngày trực hoặc khi điều khiển phương tiện tham gia giao thông mà trong máu hoặc hơi thở có nồng độ cồn bị xử lý bằng hình thức nào?", "o": {"A": "Hạ một bậc danh hiệu thi đua năm", "B": "Hạ một bậc xếp loại cán bộ", "C": "Khiển trách", "D": "Cảnh cáo"}, "c": "D"}, {"n": 58, "q": "Đồng chí cho biết Điều lệnh đội ngũ CAND quy định vị trí chỉ huy truyền đạt mệnh lệnh đội hình Tiểu đội hàng ngang, cách hàng ngang trên cùng là bao nhiêu”", "o": {"A": "01 mét", "B": "Từ 03 đến 05 bước", "C": "Từ 02 đến 03 bước", "D": "Từ 03 đến 04 bước"}, "c": "B"}, {"n": 59, "q": "Tự ý trang bị công cụ hỗ trợ, thiết bị kỹ thuật nghiệp vụ, thông tin liên lạc không phải do ngành Công an trang cấp hoặc chưa được cấp có thẩm quyền cho phép để phục vụ công tác bị xử lý bằng hình thức nào?", "o": {"A": "Hạ một bậc danh hiệu thi đua năm", "B": "Hạ một bậc xếp loại cán bộ", "C": "Khiển trách", "D": "Cảnh cáo"}, "c": "D"}, {"n": 60, "q": "Điều lệnh đội ngũ CAND quy định vị trí chỉ huy truyền đạt mệnh lệnh đội hình Tiểu đội hàng dọc, cách đội hình tiểu đội là bao nhiêu?", "o": {"A": "01 mét", "B": "Từ 03 đến 05 bước", "C": "Từ 02 đến 03 bước", "D": "Từ 03 đến 04 bước"}, "c": "B"}, {"n": 61, "q": "Đồng chí cho biết Điều lệnh đội ngũ CAND quy định vị trí chỉ huy khi hành tiến đối với đội hình Trung đội như thế nào?", "o": {"A": "Giữa đội hình và cách đội hình từ 02 đến 03 bước", "B": "1/3 đội hình từ trên xuống và cách đội hình từ 03 đến 05 bước", "C": "Đi bên trái khoảng 1/3 đội hình từ trên xuống và cách đội hình từ 02 đến 03 bước", "D": "Trước đội hình và cách đội hình khoảng cách thích hợp."}, "c": "C"}, {"n": 62, "q": "Cán bộ, chiến sĩ giao phương tiện, thiết bị kỹ thuật nghiệp vụ phục vụ công tác cho người không có đủ thẩm quyền và điều kiện sử dụng; cán bộ, chiến sĩ bỏ tập huấn điều lệnh, quân sự, võ thuật không lý do thì bị xử lý bằng hình thức nào?", "o": {"A": "Hạ một bậc danh hiệu thi đua năm", "B": "Hạ một bậc xếp loại cán bộ", "C": "Khiển trách", "D": "Cảnh cáo"}, "c": "C"}];
var KEY="quiz-dieulenh-cand-2026";
var order=[],idx=0,ans={};
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.ans)ans=s.ans}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans:ans}))}catch(e){}}
function $(i){return document.getElementById(i)}
function build(){
  var ids=DATA.map(function(q){return q.n});
  if($("wrongOnly").checked){ids=ids.filter(function(n){return ans[n]&&ans[n]!==byN(n).c})}
  if($("shuf").checked){for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}}
  order=ids;idx=0;render();
}
function byN(n){return DATA.filter(function(q){return q.n===n})[0]}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function stats(){var r=0,w=0;DATA.forEach(function(q){if(ans[q.n]){ans[q.n]===q.c?r++:w++}});return{r:r,w:w}}
function render(){
  $("tot").textContent=DATA.length;
  var st=stats();
  $("sc").textContent="Đúng "+st.r+" · Sai "+st.w+" · Chưa làm "+(DATA.length-st.r-st.w);
  $("pb").style.width=((st.r+st.w)/DATA.length*100)+"%";
  var m=$("main");
  if(!order.length){m.innerHTML='<div class="card">Không có câu nào để hiển thị. Hãy bỏ chọn "Chỉ làm lại câu sai".</div>';$("pos").textContent="";renderGrid();return}
  var q=byN(order[idx]),a=ans[q.n];
  $("pos").textContent="Câu "+(idx+1)+"/"+order.length;
  var h='<div class="card"><div class="qn">CÂU '+q.n+'</div><p class="q">'+esc(q.q)+'</p>';
  ["A","B","C","D"].forEach(function(k){
    var cls="o";
    if(a){if(k===q.c)cls+=" ok";else if(k===a)cls+=" no"}
    h+='<button class="'+cls+'" data-k="'+k+'"'+(a?" disabled":"")+'><b>'+k+'.</b><span>'+esc(q.o[k])+'</span></button>';
  });
  if(a){h+= a===q.c?'<div class="fb ok">Chính xác!</div>':'<div class="fb no">Chưa đúng. Đáp án đúng là '+q.c+'.</div>'}
  h+='</div><div class="nav"><button class="b" id="pv"'+(idx===0?" disabled":"")+'>← Câu trước</button><button class="b p" id="nx">'+(idx===order.length-1?"Xem kết quả":"Câu tiếp →")+'</button></div>';
  m.innerHTML=h;
  Array.prototype.forEach.call(m.querySelectorAll(".o"),function(b){b.onclick=function(){ans[q.n]=b.getAttribute("data-k");save();render()}});
  $("pv").onclick=function(){idx--;render()};
  $("nx").onclick=function(){if(idx===order.length-1)result();else{idx++;render();window.scrollTo(0,0)}};
  renderGrid();
}
function renderGrid(){
  var cur=order.length?order[idx]:-1;
  $("grid").innerHTML=DATA.map(function(q){
    var c="g";if(ans[q.n])c+=ans[q.n]===q.c?" ok":" no";if(q.n===cur)c+=" cur";
    return '<button class="'+c+'" data-n="'+q.n+'">'+q.n+'</button>'}).join("");
  Array.prototype.forEach.call($("grid").querySelectorAll(".g"),function(b){b.onclick=function(){
    var n=+b.getAttribute("data-n");var p=order.indexOf(n);
    if(p<0){order=DATA.map(function(q){return q.n});p=order.indexOf(n);$("shuf").checked=false;$("wrongOnly").checked=false}
    idx=p;render();window.scrollTo(0,0)}});
}
function result(){
  var st=stats(),done=st.r+st.w;
  var h='<div class="card"><div class="qn">KẾT QUẢ</div><div class="big">'+st.r+'/'+DATA.length+'</div><p>Đúng '+st.r+' · Sai '+st.w+' · Chưa làm '+(DATA.length-done)+'</p>';
  var bad=DATA.filter(function(q){return ans[q.n]&&ans[q.n]!==q.c});
  if(bad.length){h+='<b>Các câu làm sai:</b>';bad.forEach(function(q){
    h+='<div class="rv"><b>Câu '+q.n+'.</b> '+esc(q.q)+'<br><span class="y">Bạn chọn '+ans[q.n]+'. '+esc(q.o[ans[q.n]])+'</span><br><span class="a">Đáp án đúng '+q.c+'. '+esc(q.o[q.c])+'</span></div>'})}
  h+='</div><div class="nav"><button class="b" id="bk">← Quay lại</button><button class="b p" id="rt">Làm lại câu sai</button></div>';
  $("main").innerHTML=h;
  $("bk").onclick=function(){render()};
  $("rt").onclick=function(){$("wrongOnly").checked=true;build()};
  window.scrollTo(0,0);
}
$("shuf").onchange=build;$("wrongOnly").onchange=build;
$("reset").onclick=function(){if(confirm("Xóa toàn bộ kết quả đã làm?")){ans={};save();$("wrongOnly").checked=false;build()}};
build();
</script></body></html>
